server.port=8081
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productoscruddb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# MongoDB. Puede ser local o una cadena de MongoDB Atlas en MONGODB_URI.
# Spring Boot 4 renombro spring.data.mongodb.uri a spring.mongodb.uri.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/productoscrudmongo}
