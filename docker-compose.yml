services:
  mysql:
    image: mysql:8.4
    container_name: pa2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Spring_boot_crud/dbs/productoscruddb.sql:/docker-entrypoint-initdb.d/01-productos.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: pa2-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./Spring_boot_crud/dbs/mongo-init.js:/docker-entrypoint-initdb.d/01-productos.js:ro

volumes:
  mysql_data:
  mongo_data:
